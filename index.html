<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- displays site properly based on user's device -->

        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="./assets/images/favicon-32x32.png"
        />

        <title>Frontend Mentor | Social links profile</title>

        <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
        <style>
            .attribution {
                font-size: 0.6875rem;
                text-align: center;
            }
            .attribution a {
                color: hsl(228, 45%, 44%);
            }
        </style>
    </head>
    <body>
        <main>
            <section class="card">
                <img src="assets/images/avatar-jessica.jpeg" alt="Jessica Randall" class="card__avatar" />
                <h1 class="card__owner">Jessica Randall</h1>
                <p class="card__location">London, United Kingdom</p>
                <p class="card__description">
                    "Front-end developer and avid reader."
                </p>
                <ul class="card__links">
                    <li class="card__link"><a href="#">GitHub</a></li>
                    <li class="card__link"><a href="#">Frontend Mentor</a></li>
                    <li class="card__link"><a href="#">LinkedIn</a></li>
                    <li class="card__link"><a href="#">Twitter</a></li>
                    <li class="card__link"><a href="#">Instagram</a></li>
                </ul>
            </section>
        </main>
              
        <footer class="attribution">
            Challenge by
            <a href="https://www.frontendmentor.io?ref=challenge"
                >Frontend Mentor</a
            >. Coded by <a href="https://www.frontendmentor.io/profile/DavydIkkes">Davyd Ikkes</a>.
        </footer>
    </body>
</html>
